apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: observe_municipalities
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [municipality]
  description: >
    Observe municipalities supported by NFe.io (v2.0.0 canonical name;
    renames pre-v2.0.0 list_municipalities). GET /v2/municipalities.
    Cached 1h per (state_code, page, page_size); upstream errors
    trigger stale-while-error fallback.
  input_schema:
    type: object
    properties:
      state_code: {type: string}
      page:       {type: integer, default: 1}
      page_size:  {type: integer, default: 100}
