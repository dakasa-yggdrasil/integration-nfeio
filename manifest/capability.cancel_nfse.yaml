apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: cancel_nfse
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [service_invoice]
  description: >
    PUT /v2/companies/{id}/serviceinvoices/{invoice_id}/cancel. 422
    cancellation_window_closed is terminal — caller compensates instead
    of retrying.
  input_schema:
    type: object
    required: [invoice_id]
    properties:
      company_id: {type: string}
      invoice_id: {type: string}
