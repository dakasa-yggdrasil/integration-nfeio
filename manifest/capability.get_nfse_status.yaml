apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: get_nfse_status
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [service_invoice]
  description: >
    GET /v2/companies/{id}/serviceinvoices/{invoice_id}. Returns the
    current NFe.io status envelope (id, status, flowStatus, number,
    checkCode). 404 surfaces as terminal *NfeIoAPIError.
  input_schema:
    type: object
    required: [invoice_id]
    properties:
      company_id: {type: string}
      invoice_id: {type: string}
