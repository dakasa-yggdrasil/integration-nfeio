apiVersion: yggdrasil.io/v1alpha1
kind: integration_type
metadata:
  name: nfeio
  namespace: global
spec:
  provider: nfeio
  # INTEGRATION_CONTRACT §17 — adapter self-declares its purpose.
  # NFE.io issues fiscal documents (NFSe service invoices, bulk emission).
  domain: payments
  # Provider-side management UI. Surfaces render an "Abrir NFE.io" CTA.
  dashboard:
    url: https://app.nfe.io
    label: "Abrir NFE.io"
  version: 3.1.1
  adapter:
    image_repo: ghcr.io/dakasa-yggdrasil/integration-nfeio
    image_tag: v3.1.1
    transport: http_json
    endpoints:
      describe: /rpc/describe
      execute: /rpc/execute
    version: 3.1.1
    timeout_seconds: 60
  credential_schema:
    mode: inline
    required:
    - NFEIO_API_KEY
    - NFEIO_WEBHOOK_SECRET
    properties:
      NFEIO_API_KEY:
        type: string
        secret: true
      NFEIO_WEBHOOK_SECRET:
        type: string
        secret: true
  action_catalog:
  - name: ensure_service_invoice
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: observe_service_invoices
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: destroy_service_invoice
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: retrieve_pdf
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: retrieve_xml
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: ensure_company
    category: capability
    idempotent: true
    resource_types:
    - company
  - name: observe_companies
    category: capability
    idempotent: true
    resource_types:
    - company
  - name: observe_municipalities
    category: capability
    idempotent: true
    resource_types:
    - municipality
  - name: manage_template
    category: capability
    idempotent: true
    resource_types:
    - municipality_template
  - name: bulk_issue
    category: capability
    idempotent: true
    resource_types:
    - service_invoice
  - name: calculate_iss
    category: capability
    idempotent: true
    resource_types:
    - municipality_template
  - name: ensure_webhook_subscription
    category: capability
    idempotent: true
    resource_types:
    - webhook_subscription
  - name: observe_webhook_subscriptions
    category: capability
    idempotent: true
    resource_types:
    - webhook_subscription
  - name: destroy_webhook_subscription
    category: capability
    idempotent: true
    resource_types:
    - webhook_subscription
  - name: nfse_webhook_received
    category: reactor
    idempotent: true
    resource_types:
    - service_invoice
  resource_types:
  - name: service_invoice
    discoverable: false
    default_actions:
    - ensure_service_invoice
    - observe_service_invoices
    - destroy_service_invoice
    - retrieve_pdf
    - retrieve_xml
    - bulk_issue
    canonical_prefix: thirdparty.nfeio.service_invoice
    identity_template: service_invoice.{external_id}
  - name: company
    discoverable: false
    default_actions:
    - ensure_company
    - observe_companies
    canonical_prefix: thirdparty.nfeio.company
    identity_template: company.{federal_tax_number}
  - name: municipality
    discoverable: false
    default_actions:
    - observe_municipalities
    canonical_prefix: thirdparty.nfeio.municipality
    identity_template: municipality.{code}
  - name: municipality_template
    discoverable: false
    default_actions:
    - manage_template
    - calculate_iss
    canonical_prefix: thirdparty.nfeio.municipality_template
    identity_template: municipality_template.{code}
  - name: webhook_subscription
    discoverable: false
    default_actions:
    - ensure_webhook_subscription
    - observe_webhook_subscriptions
    canonical_prefix: thirdparty.nfeio.webhook_subscription
    identity_template: webhook_subscription.{id}
  discovery:
    mode: push
    supports_webhooks: true
  normalization:
    external_id_path: id
    name_path: external_id
    fallback_resource_prefix: thirdparty.nfeio.custom
  capabilities:
  - describe
  - execute
  execution:
    supports_dry_run: false
    idempotent_actions:
    - ensure_service_invoice
    - observe_service_invoices
    - destroy_service_invoice
    - retrieve_pdf
    - retrieve_xml
    - ensure_company
    - observe_companies
    - observe_municipalities
    - manage_template
    - bulk_issue
    - calculate_iss
    - ensure_webhook_subscription
    - observe_webhook_subscriptions
    - destroy_webhook_subscription
  instance_schema:
    mode: inline
    properties:
      environment:
        type: string
        description: Ambiente alvo da API NFe.io. Use sandbox para homologação.
        enum:
        - production
        - sandbox
        default: production
  extensions:
    preserve_raw_payload: true
