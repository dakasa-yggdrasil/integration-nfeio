apiVersion: yggdrasil.io/v1alpha1
kind: integration_type
metadata:
  name: nfeio
  namespace: global
spec:
  provider: nfeio
  version: 2.0.0
  adapter:
    image_repo: ghcr.io/dakasa-yggdrasil/integration-nfeio
    image_tag: v2.0.0
    transport: http_json
    endpoints:
      describe: /rpc/describe
      execute: /rpc/execute
  credential_schema:
    mode: env
    required: [NFEIO_API_KEY, NFEIO_WEBHOOK_SECRET]
  # v2.0.0 canonical capability names (per docs/superpowers/specs/2026-05-27-yggdrasil-integration-capability-convention.md §7 Tier C nfe.io).
  action_catalog:
    - name: ensure_service_invoice
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: observe_service_invoices
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: destroy_service_invoice
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: retrieve_pdf
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: retrieve_xml
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: ensure_company
      category: capability
      idempotent: true
      resource_types: [company]
    - name: observe_companies
      category: capability
      idempotent: true
      resource_types: [company]
    - name: observe_municipalities
      category: capability
      idempotent: true
      resource_types: [municipality]
    - name: manage_template
      category: capability
      idempotent: true
      resource_types: [municipality_template]
    - name: bulk_issue
      category: capability
      idempotent: true
      resource_types: [service_invoice]
    - name: calculate_iss
      category: capability
      idempotent: true
      resource_types: [municipality_template]
    - name: ensure_webhook_subscription
      category: capability
      idempotent: true
      resource_types: [webhook_subscription]
    - name: observe_webhook_subscriptions
      category: capability
      idempotent: true
      resource_types: [webhook_subscription]
    - name: destroy_webhook_subscription
      category: capability
      idempotent: true
      resource_types: [webhook_subscription]
    - name: nfse_webhook_received
      category: reactor
      idempotent: true
      resource_types: [service_invoice]
