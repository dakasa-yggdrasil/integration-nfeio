apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: ensure_webhook_subscription
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [webhook_subscription]
  description: >
    Reconcile one pre-existing NFe.io webhook by exact ID. GET then PUT
    /v2/webhooks/{id}; only insecureSsl=true to false is mutable. The
    adapter never creates, lists, or adopts by mutable attributes and
    preserves every other provider field.
  input_schema:
    type: object
    required: [id, insecure_ssl]
    properties:
      id: {type: string}
      insecure_ssl:
        type: boolean
        enum: [false]
