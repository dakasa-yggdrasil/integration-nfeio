apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: ensure_webhook_subscription
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [webhook_subscription]
  description: >
    Ensure a webhook subscription exists at NFe.io for the given URL +
    events list (v2.0.0 NEW resource). POSTs /v2/webhooks; 409/422
    duplicate decoded into existing envelope (idempotent success
    path via adoption).
  input_schema:
    type: object
    required: [url, events]
    properties:
      url:        {type: string}
      events:     {type: array, items: {type: string}}
      company_id: {type: string}
