apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: destroy_service_invoice
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [service_invoice]
  description: >
    Destroy (cancel) an emitted NFSe (v2.0.0 canonical name; collapses
    pre-v2.0.0 cancel_nfse). PUT
    /v2/companies/{id}/serviceinvoices/{invoice_id}/cancel. 422
    cancellation_window_closed is terminal — caller compensates instead
    of retrying. 404 → already-absent success per convention §5.
  input_schema:
    type: object
    required: [invoice_id]
    properties:
      company_id: {type: string}
      invoice_id: {type: string}
