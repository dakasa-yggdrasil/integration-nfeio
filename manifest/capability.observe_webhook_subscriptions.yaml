apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: observe_webhook_subscriptions
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [webhook_subscription]
  description: >
    Observe one pre-existing webhook by exact ID with GET
    /v2/webhooks/{id}. Enumeration and attribute-based adoption are
    deliberately unavailable. Output contains no provider secrets,
    URI, headers, properties, or raw payload.
  input_schema:
    type: object
    required: [id]
    properties:
      id: {type: string}
