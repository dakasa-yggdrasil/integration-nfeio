apiVersion: yggdrasil.io/v1alpha1
kind: capability
metadata:
  name: destroy_webhook_subscription
  namespace: dakasa
spec:
  integration_type: nfeio
  category: capability
  idempotent: true
  resource_types: [webhook_subscription]
  description: >
    Deliberately destroy one webhook by exact ID only when confirm_id
    exactly equals id. DELETE /v2/webhooks/{id}; 404 is already-absent
    success. This action is excluded from webhook default_actions.
  input_schema:
    type: object
    required: [id, confirm_id]
    properties:
      id: {type: string}
      confirm_id: {type: string}
